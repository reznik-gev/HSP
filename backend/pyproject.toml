[project]
name = "hsp"
version = "0.1.0"
description = "HSP (Human-Space Program) API service"
readme = "README.md"
authors = [
    { name = "gev", email = "reznikgev@gmail.com" }
]
requires-python = ">=3.14,<3.15"
license = "LicenseRef-Proprietary"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.152.0",
    "geoalchemy2>=0.20.0",
    "httpx2>=2.15.1",
    "joserfc>=1.7.7",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uuid-utils>=1.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hsp-api = "hsp.serve:main"
hsp-export-openapi = "hsp.openapi_export:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-openpyxl>=3.1.5.20261017",
]

# --- Tooling (docs/0062) -----------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # blocking calls in async code (docs/0010)
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["hsp"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "shapely.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: integration test against a real PostGIS database (docs/0061); requires HSP_TEST_DATABASE_URL",
]
