# Claude's code review (docs/0101): does the PR follow HSP's guides and decisions, and will it be
# easy to maintain? Runs when a PR is opened or marked ready, and again when someone with write
# access comments "@claude review" on the PR. It comments only; it never blocks a merge (it isn't
# part of ci-ok) and never changes code.
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    # The job's own GITHUB_TOKEN, so GitHub enforces these: it can comment, not push.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout the PR
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0 # Full history, to diff against the base and read past decisions
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}.
            You review only. Never edit files, commit or push.

            ## Read first
            1. CLAUDE.md, and every guide it links that applies to what the PR touches:
               docs/guides/git.md, docs/guides/testing.md (its "Review checklist" is required
               for any PR with tests), docs/guides/stacked-prs.md, backend/README.md,
               frontend/README.md, shared/validation-cases/README.md.
            2. docs/decisions/README.md, and every decision the PR names or whose area it touches.
            3. The PR: description, commits (`gh pr view N --json commits`), every comment and
               review thread (`gh pr view N --comments`, and
               `gh api repos/${{ github.repository }}/pulls/N/comments` for comments on lines), and the
               full diff against its base (`gh pr diff N`). Read the code around each change, not
               only the changed lines.

            ## What to look for, in this order
            1. **Guides and decisions.** Anything that breaks a rule in the guides or goes against
               an accepted decision. Name the rule and link the file. Examples: test data defined
               inside a test body; an accepted decision record edited (a new one must supersede
               it); a product or technical choice made without a decision record; user-facing text
               without both English and Hebrew; review fixes squashed into reviewed commits;
               commit messages that don't say what changes for the user and why.
            2. **Maintainability.** Code that will be hard to change later: duplication that should
               be shared, names that don't say what a thing is, functions doing several jobs, dead
               or speculative code, comments that don't match the code, tests that check
               implementation details over behaviour, and code that doesn't read like the code
               around it.
            3. **Clear bugs** you noticed along the way. Don't hunt for them; other checks do.

            Skip anything ruff, mypy, ESLint, Prettier or tsc already enforce, and pure style
            preferences no guide states. Don't repeat a point already raised on the PR, unless the
            latest commits didn't address it: then say so in the summary. Prefer a few comments
            that matter over many small ones.

            ## How to report
            - One inline comment per finding, on the exact lines, with
              `mcp__github_inline_comment__create_inline_comment` (confirmed: true). Say what's
              wrong, which guide or decision it breaks (with a link), and what to do.
            - When the fix is small and you're sure of it, include a GitHub suggestion block
              (```suggestion) with the replacement lines, so it can be applied with one click.
            - Then one summary comment on the PR with `gh pr comment`: the findings by importance,
              one line each, or "No issues found. Checked guide and decision compliance and
              maintainability." Write in plain English: short sentences, no jargon.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)"
            "Bash(git blame:*)" "Bash(git grep:*)"
            "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)" "Bash(gh pr comment:*)"
            "Bash(gh api:*)"
            "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools
            "Edit" "Write" "MultiEdit" "NotebookEdit"
            "Bash(git add:*)" "Bash(git commit:*)" "Bash(git push:*)"
            "Bash(gh api *-X*)" "Bash(gh api *--method*)"
            "Bash(gh api *-f*)" "Bash(gh api *-F*)" "Bash(gh api *--field*)" "Bash(gh api *--raw-field*)"
            "Bash(gh api *--input*)" "Bash(gh api graphql*mutation*)"
