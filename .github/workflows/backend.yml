# Backend CI (docs/0053, 0061, 0062).
name: backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: hsm
          POSTGRES_PASSWORD: hsm
          POSTGRES_DB: hsm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hsm -d hsm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HSM_TEST_DATABASE_URL: postgresql+asyncpg://hsm:hsm@localhost:5432/hsm_test
      HSM_DATABASE_URL: postgresql+asyncpg://hsm:hsm@localhost:5432/hsm_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit + DB integration; also applies all migrations to an empty DB)
        run: uv run pytest
      - name: Models match migrations
        run: uv run alembic check
      - name: OpenAPI schema is up to date
        run: |
          uv run hsm-export-openapi openapi.json
          git diff --exit-code -- openapi.json || {
            echo "::error::backend/openapi.json is stale. Run 'uv run hsm-export-openapi openapi.json' and commit."
            exit 1
          }
