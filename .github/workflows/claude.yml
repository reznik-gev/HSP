# The @claude bot: answers questions and reviews on PRs and issues when someone with write access
# mentions it (docs/0101). It never changes code: coding happens in Claude Code sessions.
#
# It runs on this job's own GITHUB_TOKEN, not the Claude app's token, so GitHub itself enforces
# the permissions below: it can comment, but a push is refused. The tool rules repeat that.
# Comment-triggered workflows always run from `main`'s copy of this file, so changes here take
# effect only after they merge.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # "@claude review" in a PR's conversation goes to the full review in claude-code-review.yml.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        !(github.event.issue.pull_request && startsWith(github.event.comment.body, '@claude review'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Comments, inline comments and suggestions
      issues: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history, so it can diff a PR against the one below it in a stack
          # Don't leave the token in the checkout's git config; the bot has no use for it.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Reads: the code, read-only git and gh (`gh api` for review comments, which `gh pr view`
          # doesn't show), CI results and the web. Writes: comments and inline suggestions only.
          # Blocked: editing files, committing, pushing, and the gh api flags that write.
          # The --disallowedTools list matches claude-code-review.yml's; keep the two in sync.
          claude_args: >-
            --model claude-sonnet-5-5
            --allowedTools
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)"
            "Bash(git blame:*)" "Bash(git grep:*)"
            "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)" "Bash(gh run view:*)"
            "Bash(gh api:*)"
            "mcp__github_inline_comment__create_inline_comment"
            "WebSearch" "WebFetch"
            --disallowedTools
            "Edit" "Write" "MultiEdit" "NotebookEdit"
            "Bash(git add:*)" "Bash(git commit:*)" "Bash(git push:*)" "Bash(git rm:*)"
            "Bash(git checkout:*)" "Bash(git switch:*)" "Bash(git reset:*)"
            "mcp__github_file_ops__commit_files" "mcp__github_file_ops__delete_files"
            "Bash(gh api *-X*)" "Bash(gh api *--method*)"
            "Bash(gh api *-f*)" "Bash(gh api *-F*)" "Bash(gh api *--field*)" "Bash(gh api *--raw-field*)"
            "Bash(gh api *--input*)" "Bash(gh api graphql*mutation*)"
            --append-system-prompt "You are HSP's review bot. You never change code: no edits,
            commits or pushes, even when asked. Coding happens in Claude Code sessions. When
            someone asks for a change, reply with what you would change and why. For a small,
            certain fix, post it as an inline comment with a GitHub suggestion block on the exact
            lines, so the owner can apply it with one click. Read the whole PR first: its
            description, all comments and review threads (gh api repos/{owner}/{repo}/pulls/N/comments),
            the diff, and the code around it. Follow CLAUDE.md and the guides it links."
