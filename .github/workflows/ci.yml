# Single CI workflow with a gate job (docs/0070).
#
# Always runs on every PR. `changes` decides which areas need checking; area jobs are skipped
# when untouched; `ci-ok` is the ONLY required status check in the `main` ruleset. It fails if
# any area job failed or was cancelled, and passes if they succeeded or were skipped. This keeps
# docs-only PRs mergeable and new jobs never require ruleset changes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A PR carries no merge commits (docs/0141): branches catch up by rebasing. Checks the PR's own
  # commits, from its base to its head, not the merge ref GitHub checks out by default.
  linear-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: No merge commits between the base and the head
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE..$HEAD_SHA")
          if [ -n "$merges" ]; then
            git log --oneline --no-walk $merges
            echo "::error::This PR has merge commits. Musical Chairs merges by rebase only (docs/0141): rebase onto the base branch (git rebase origin/main) and push with --force-with-lease. Never merge main in, even when Auto-fix says to."
            exit 1
          fi

  # Every commit message has a summary line and a body (docs/0148). Runs the same hook as a local
  # commit, on the PR's own commits. Unlike the hook, it also fails fixup!/squash!/amend! commits:
  # a rebase merge would land them on main as they are.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every commit has a summary line and a body
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges --reverse "$BASE..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            subject=$(head -n 1 "$RUNNER_TEMP/msg")
            case $subject in
              fixup!* | squash!* | amend!*)
                echo "::error::$(git log -1 --format='%h %s' "$sha"): fold this commit into the one it fixes before the PR merges."
                failed=1
                continue ;;
            esac
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha"): the message needs a summary line of at most 100 characters and a body that says why (docs/0148). Rewording it needs a force-push, so ask the owner first."
              failed=1
            fi
          done
          exit $failed

  # A PR that builds on another open PR can't merge until that one has (docs/0154). Every PR's base
  # is main; a PR built on another holds that PR's commits too. Fails while this PR holds another
  # open PR's head commit, or copies of commits already on main (the PR below merged, and this one
  # wasn't rebased yet). Nothing re-runs it when the PR below merges: the rebase push does.
  builds-on-open-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: No commits of another open PR, and none already on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::This PR's base is $BASE_REF. Every PR's base is $DEFAULT_BRANCH, also one that builds on another PR (docs/0154): gh pr edit $PR --base $DEFAULT_BRANCH."
            exit 1
          fi
          # The base as it is now, not as it was when the PR was opened.
          git fetch -q --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          base=$(git rev-parse "origin/$DEFAULT_BRANCH")
          failed=0

          # A copy of a commit already on main: the PR below merged, and this one needs a rebase.
          copies=$(git cherry "$base" "$HEAD_SHA" | sed -n 's/^- //p')
          if [ -n "$copies" ]; then
            git log --oneline --no-walk $copies
            echo "::error::This PR holds copies of commits already on $DEFAULT_BRANCH, so the PR below it has merged. Rebase onto $DEFAULT_BRANCH (git rebase origin/$DEFAULT_BRANCH) and push with --force-with-lease (docs/0154)."
            failed=1
          fi

          # Another open PR's head commit inside this one. PR heads from forks are fetched too.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
            --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"')
          git fetch -q --no-tags origin '+refs/pull/*/head:refs/remotes/pull/*'
          below=""
          while read -r n sha; do
            [ -n "$n" ] && [ "$n" != "$PR" ] || continue
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::Couldn't fetch the head of #$n ($sha), so can't tell whether this PR builds on it. Re-run this job."
              failed=1
              continue
            fi
            git merge-base --is-ancestor "$sha" "$HEAD_SHA" || continue
            git merge-base --is-ancestor "$sha" "$base" && continue
            # Two PRs with the same head: the newer one is the one built on the other.
            if [ "$sha" = "$HEAD_SHA" ] && [ "$n" -gt "$PR" ]; then continue; fi
            below="$below #$n"
          done <<< "$open"
          if [ -n "$below" ]; then
            echo "::error::This PR builds on open PR(s)$below, and holds their commits. It can't merge until they have. Keep it a draft; once they merge, rebase onto $DEFAULT_BRANCH, push with --force-with-lease and mark it ready (docs/0154)."
            failed=1
          fi
          exit $failed

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backup: ${{ steps.filter.outputs.backup }}
      scripts: ${{ steps.filter.outputs.scripts }}
      images: ${{ steps.filter.outputs.images }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "shared/**"
              - ".github/workflows/ci.yml"
            frontend:
              - "frontend/**"
              - "shared/**"
              - "backend/openapi.json"
              - ".github/workflows/ci.yml"
            backup:
              - "backup/**"
              - ".github/workflows/ci.yml"
            scripts:
              - "deploy/**/*.sh"
              - "deploy/bin/**"
              - ".githooks/**"
              - ".github/workflows/ci.yml"
            images:
              - "backend/**"
              - "frontend/**"
              - "deploy/web/**"
              - "deploy/keycloak/**"
              - "deploy/backup/**"
              - "deploy/trivy/**"
              - "backup/**"
              - "deploy/*.sh"
              - "deploy/compose/compose.yml"
              - ".github/workflows/ci.yml"
            packages:
              - "backend/pyproject.toml"
              - "backend/uv.lock"
              - "backup/pyproject.toml"
              - "backup/uv.lock"
              - "frontend/package.json"
              - "frontend/pnpm-lock.yaml"
              - "deploy/audit-packages.sh"
              - ".github/workflows/ci.yml"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: musical_chairs
          POSTGRES_PASSWORD: musical_chairs
          POSTGRES_DB: musical_chairs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U musical_chairs -d musical_chairs_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MUSICAL_CHAIRS_TEST_DATABASE_URL: postgresql+asyncpg://musical_chairs:musical_chairs@localhost:5432/musical_chairs_test
      MUSICAL_CHAIRS_DATABASE_URL: postgresql+asyncpg://musical_chairs:musical_chairs@localhost:5432/musical_chairs_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit + DB integration; also applies all migrations to an empty DB)
        # Coverage is measured on every run, as it adds little time. A report, not a gate (docs/0114).
        run: uv run pytest --cov --cov-report=term --cov-report=html --cov-report=xml --cov-report=json
      - name: Coverage summary
        run: |
          {
            echo "### Backend coverage"
            echo
            echo "| Statements | Branches | Both |"
            echo "|---|---|---|"
            jq -r '.totals | "| \(.percent_statements_covered_display)% | \(.percent_branches_covered_display)% | \(.percent_covered_display)% |"' coverage/coverage.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage report (pushes to main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30
      - name: Models match migrations
        run: uv run alembic check
      - name: OpenAPI schema is up to date
        run: |
          uv run musical-chairs-export-openapi openapi.json
          git diff --exit-code -- openapi.json || {
            echo "::error::backend/openapi.json is stale. Run 'uv run musical-chairs-export-openapi openapi.json' and commit."
            exit 1
          }

  # The backup service (docs/0106). Its tests need no database; the weekly restore test runs it
  # for real.
  backup:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backup
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  # The operator and deploy scripts (docs/0107). shellcheck comes with GitHub's Ubuntu runners.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/bin/musical-chairs .githooks/commit-msg .githooks/pre-commit .githooks/tests/run.sh
      - name: The commit-msg hook accepts and rejects its sample messages
        run: sh .githooks/tests/run.sh

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match backend/openapi.json
        run: |
          pnpm api:types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run 'pnpm api:types' and commit."
            exit 1
          }
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Tests
        # Coverage is measured on every run, as it adds little time. A report, not a gate (docs/0114).
        run: pnpm test:coverage
      - name: Coverage summary
        run: |
          {
            echo "### Frontend coverage"
            echo
            echo "| Statements | Branches | Functions | Lines |"
            echo "|---|---|---|---|"
            jq -r '.total | "| \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage report (pushes to main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30
      - name: Build
        run: pnpm build

  # Build the production images and smoke-test them (docs/0097). Nothing is pushed.
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Exposes the Actions cache token to `docker buildx` for the gha build cache.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build musical-chairs-api, musical-chairs-web, musical-chairs-keycloak and musical-chairs-backup
        run: MUSICAL_CHAIRS_BUILD_CACHE=gha deploy/build-images.sh
      - name: Smoke test
        run: deploy/smoke-images.sh
      - name: Vulnerability scan (warns only, docs/0128)
        run: deploy/scan-images.sh

  # Known vulnerabilities in the packages Musical Chairs ships (docs/0128). Warns only; fails only
  # when a scanner can't run. Reads the lock files; only backend/'s environment, for pip-audit, is
  # set up.
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Vulnerability scan (warns only)
        run: deploy/audit-packages.sh

  ci-ok:
    if: always()
    needs: [changes, linear-history, commit-messages, builds-on-open-pr, backend, backup, scripts, frontend, images, packages]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job ended with '$r'"; exit 1 ;;
            esac
          done
