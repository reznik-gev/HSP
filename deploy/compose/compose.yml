# HSP production stack on one host (docs/0055, docs/0099).
#
# An installation directory holds this file next to:
#   .env              settings (see .env.example)
#   secrets/          one file per secret (see .env.example), readable by its container's user
#   tls/              tls.crt and tls.key, when hsp-web terminates TLS
#   postgres-init/    roles and databases, run once on an empty data directory
#   backups.yml       when and where to back up (see backups.example.yml)
# and keeps its data under HSP_DATA_DIR. `hsp install` (bin/hsp) prepares all of it.
#
#   docker compose up -d
name: hsp

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hsp-api: &hsp-api
  image: hsp-api:${HSP_VERSION:?set HSP_VERSION in .env}
  pull_policy: never # images are loaded from the release bundle (docs/0054)
  environment:
    HSP_DATABASE_URL: postgresql+asyncpg://hsp@postgres:5432/hsp
    HSP_PUBLIC_URL: ${HSP_PUBLIC_URL:?set HSP_PUBLIC_URL in .env}
    # The API talks to Keycloak inside the stack; Keycloak still names its public URL as the
    # issuer (KC_HOSTNAME_BACKCHANNEL_DYNAMIC below).
    HSP_OIDC_ISSUER_URL: http://keycloak:8080/auth/realms/hsp
    HSP_API_WORKERS: ${HSP_API_WORKERS:-4}
    HSP_LOG_LEVEL: ${HSP_LOG_LEVEL:-INFO}
    # Tracing (docs/0105): off unless an OTLP endpoint is set. The standard OpenTelemetry settings.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  secrets: [hsp_database_password, hsp_session_encryption_key, hsp_oidc_client_secret]
  logging: *logging

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
    secrets: [db_superuser_password, hsp_database_password, keycloak_db_password]
    volumes:
      - ${HSP_DATA_DIR:-/var/lib/hsp}/postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hsp"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  # One-shot: brings the HSP schema up to date, then exits (docs/0056).
  migrate:
    <<: *hsp-api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hsp-api
    restart: unless-stopped
    # Prometheus metrics (docs/0105): host-only unless HSP_METRICS_ADDRESS names another interface.
    ports:
      - "${HSP_METRICS_ADDRESS:-127.0.0.1}:${HSP_API_METRICS_PORT:-9464}:9464"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # Ready means the database, its schema and Keycloak all answer (docs/0105). Keycloak's first
      # start imports the realm and can take minutes, hence the long start period; checks that fail
      # during it don't count, and the first that passes makes the API healthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

  keycloak:
    image: hsp-keycloak:${HSP_VERSION}
    pull_policy: never
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_HOSTNAME: ${HSP_PUBLIC_URL}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      # Filled into the hsp realm when it's first imported.
      HSP_PUBLIC_URL: ${HSP_PUBLIC_URL}
      HSP_OIDC_CLIENT_SECRET_FILE: /run/secrets/hsp_oidc_client_secret
    secrets: [keycloak_db_password, keycloak_admin_password, hsp_oidc_client_secret]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # The image has no curl; ask the management port with bash's /dev/tcp. Ready is a 200;
      # while starting it's a 503 whose body still says "UP" for some checks, so read the status.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 &&
          read -r status <&3 && case "$$status" in *" 200 "*) exit 0 ;; *) exit 1 ;; esac
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: *logging

  # Scheduled backups to a folder or S3, and restore (docs/0058, docs/0106). Runs as uid 999, like
  # postgres, so it reads the superuser's password and owns HSP_DATA_DIR/backups.
  backup:
    image: hsp-backup:${HSP_VERSION}
    pull_policy: never
    restart: unless-stopped
    environment:
      HSP_VERSION: ${HSP_VERSION}
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD_FILE: /run/secrets/db_superuser_password
    secrets: [db_superuser_password, backup_s3_access_key, backup_s3_secret_key]
    volumes:
      - ./backups.yml:/etc/hsp/backups.yml:ro
      - ${HSP_DATA_DIR:-/var/lib/hsp}/backups:/backups
      # With include_config, a backup holds these; never secrets/.
      - ./.env:/etc/hsp/install/.env:ro
      - ./backups.yml:/etc/hsp/install/backups.yml:ro
      - ./compose.yml:/etc/hsp/install/compose.yml:ro
    ports:
      - "${HSP_METRICS_ADDRESS:-127.0.0.1}:${HSP_BACKUP_METRICS_PORT:-9465}:9465"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9465/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  web:
    image: hsp-web:${HSP_VERSION}
    pull_policy: never
    restart: unless-stopped
    environment:
      HSP_PUBLIC_URL: ${HSP_PUBLIC_URL}
      HSP_WEB_TLS: ${HSP_WEB_TLS:-on}
      HSP_HSTS: ${HSP_HSTS:-on}
      HSP_TRUSTED_PROXIES: ${HSP_TRUSTED_PROXIES:-}
      HSP_KEYCLOAK_ADMIN_FROM: ${HSP_KEYCLOAK_ADMIN_FROM:-}
    ports:
      - "${HSP_BIND_ADDRESS:-0.0.0.0}:${HSP_HTTP_PORT:-80}:8080"
      - "${HSP_BIND_ADDRESS:-0.0.0.0}:${HSP_HTTPS_PORT:-443}:8443"
    volumes:
      - ./tls:/etc/hsp/tls:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

secrets:
  db_superuser_password: { file: ./secrets/db_superuser_password }
  hsp_database_password: { file: ./secrets/hsp_database_password }
  keycloak_db_password: { file: ./secrets/keycloak_db_password }
  keycloak_admin_password: { file: ./secrets/keycloak_admin_password }
  hsp_session_encryption_key: { file: ./secrets/hsp_session_encryption_key }
  hsp_oidc_client_secret: { file: ./secrets/hsp_oidc_client_secret }
  # Empty unless a backups.yml target is S3 (docs/0106).
  backup_s3_access_key: { file: ./secrets/backup_s3_access_key }
  backup_s3_secret_key: { file: ./secrets/backup_s3_secret_key }
