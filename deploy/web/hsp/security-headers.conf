# Security headers for HSP's own responses (docs/0060, docs/0098). Not used for Keycloak's pages,
# which send their own policy. `always` adds them to error answers too.
#
# style-src allows inline styles: the plan view renders <style> elements (PlanView.tsx).
# Scripts stay strictly same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $hsp_hsts always;
