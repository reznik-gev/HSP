# The routes of HSP's one origin (docs/0060), included by each server that serves the app.
# Expects $hsp_hsts and $hsp_forwarded_proto to be set by the server.

# $hsp_api and $hsp_keycloak, from HSP_API_UPSTREAM and HSP_KEYCLOAK_UPSTREAM.
include /etc/nginx/conf.d/hsp/upstreams.inc;

root /usr/share/nginx/html;
error_page 502 503 504 =503 /maintenance.html;

# Built assets have content hashes in their names: cache them for good.
location /assets/ {
    include /etc/nginx/hsp/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip_static on;
    try_files $uri =404;
}

# The API. /healthz, /readyz and /metrics live outside /api and are never routed here.
location /api/ {
    include /etc/nginx/hsp/security-headers.conf;
    include /etc/nginx/hsp/proxy.conf;
    error_page 502 503 504 = @api_unavailable;
    proxy_pass $hsp_api;
}

# Keycloak's admin console, its master realm and its welcome page (docs/0098): closed unless
# HSP_KEYCLOAK_ADMIN_FROM lists networks allowed to reach them.
location ~ ^/auth/(admin|realms/master)(/|$) {
    include /etc/nginx/conf.d/hsp/keycloak-admin.inc;
    add_header Strict-Transport-Security $hsp_hsts always;
    include /etc/nginx/hsp/proxy.conf;
    proxy_pass $hsp_keycloak;
}
location = /auth/ {
    include /etc/nginx/conf.d/hsp/keycloak-admin.inc;
    add_header Strict-Transport-Security $hsp_hsts always;
    include /etc/nginx/hsp/proxy.conf;
    proxy_pass $hsp_keycloak;
}

# Sign-in pages and OIDC endpoints. Keycloak sends its own Content-Security-Policy.
location /auth/ {
    add_header Strict-Transport-Security $hsp_hsts always;
    include /etc/nginx/hsp/proxy.conf;
    proxy_pass $hsp_keycloak;
}

# The single-page app: every other path is a client route, served by index.html and never cached,
# so a new release is picked up on the next page load.
location / {
    include /etc/nginx/hsp/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    gzip_static on;
    try_files $uri /index.html;
}

# The API is down, e.g. during an upgrade (docs/0056): a Problem Details answer the app can show.
location @api_unavailable {
    include /etc/nginx/hsp/security-headers.conf;
    default_type application/problem+json;
    add_header Retry-After 60 always;
    return 503 '{"type":"https://hsp.example/problems/maintenance","title":"HSP is being updated","status":503,"detail":"HSP is unavailable for a few minutes. Try again shortly."}';
}

# Keycloak is down: the sign-in pages show the maintenance page, with 503.
location = /maintenance.html {
    internal;
    include /etc/nginx/hsp/security-headers.conf;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    root /usr/share/nginx/hsp;
}
