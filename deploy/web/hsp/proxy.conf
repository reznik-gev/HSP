# What every proxied request carries (docs/0060). Keycloak builds its URLs from KC_HOSTNAME, and
# the API from HSP_PUBLIC_URL, so the forwarded host and port are informational.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $hsp_forwarded_proto;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Request-ID $hsp_request_id;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
