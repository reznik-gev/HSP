# Local development dependencies: PostGIS + Keycloak.
# The API and frontend run on the host (uv / pnpm) for fast reloads.
#
#   docker compose -f deploy/compose.dev.yml up -d
#
# Production compose (nginx, api, backup, migrate job; docs/0055) is built separately.
name: hsp-dev

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: hsp
      POSTGRES_PASSWORD: hsp
      POSTGRES_DB: hsp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsp -d hsp"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: hsp
      KC_DB_PASSWORD: hsp
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./dev/keycloak/hsp-realm.json:/opt/keycloak/data/import/hsp-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
