# Fast local checks before each commit (docs/0062). CI runs the full set and is the gate.
#   uv tool install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend exec prettier --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/(pnpm-lock\.yaml|src/api/schema\.d\.ts)$
